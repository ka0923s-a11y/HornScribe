[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hornscribe"
version = "0.1.0"
description = "Local-first audio-to-score transcription with Horn in F output"
requires-python = ">=3.11"
dependencies = [
    "music21>=9.1",
    "mido>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
engine = [
    "basic-pitch==0.4.0",
    "librosa>=0.10",
    "pretty_midi>=0.2.10",
    "mido>=1.3",
]

[project.scripts]
hornscribe = "hornscribe.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
src = ["python", "tests/python"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
mypy_path = "python"
packages = ["hornscribe"]
strict = true
# Checks run at 3.12: the supported interpreter (py -3.12) and because
# numpy 2.5+ stubs (music21 transitive dep) use 3.12 `type` syntax and
# fail to parse at 3.11. Ruff still gates syntax compat at py311.
python_version = "3.12"

# mido ships no py.typed marker; it is a tiny pure-Python SMF library.
[[tool.mypy.overrides]]
module = ["mido", "mido.*"]
ignore_missing_imports = true

# numpy 2.5+ stubs use Python 3.12 `type` statements; they are music21's
# transitive dependency, not ours — skip following them.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

# music21 is only partially typed: constructors like Tie/Part/Horn/
# TrebleClef and Stream.append are untyped. The notation adapter is the
# single boundary that calls into them, so relax that one check there.
[[tool.mypy.overrides]]
module = "hornscribe.notation.to_music21"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
