[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hornscribe"
version = "0.1.0"
description = "Local-first audio-to-score transcription with Horn in F output"
requires-python = ">=3.11"
dependencies = [
    "music21>=9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
engine = [
    "basic-pitch==0.4.0",
    "librosa>=0.10",
    "pretty_midi>=0.2.10",
    "mido>=1.3",
]

[project.scripts]
hornscribe = "hornscribe.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
src = ["python", "tests/python"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
mypy_path = "python"
packages = ["hornscribe"]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
