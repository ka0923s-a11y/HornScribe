name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check python tests scripts
      - name: Mypy
        run: mypy
      - name: Pytest (deterministic, no model downloads)
        run: pytest tests/python -q

  desktop:
    # FEAT-001 (#60): the Tauri shell gains Rust code that cannot be
    # compile-checked without MSVC — CI is the only place it gets built.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the dev toolchain (local dev runs Node 24); jsdom's
          # webidl.util.markAsUncloneable needs >=22.
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install JS deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Frontend tests
        run: npx vitest run
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Rust check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
