name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check python tests scripts
      - name: Mypy
        run: mypy
      - name: Pytest (deterministic, no model downloads)
        run: pytest tests/python -q
