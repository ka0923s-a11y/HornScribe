name: Release

# Manual dispatch (or a v* tag push) builds the desktop app on a
# hosted Windows runner (MSVC toolchain is preinstalled there) and
# publishes the NSIS installer + a portable zip to a GitHub Release.
# #266: the tag name is derived from the app version — never typed by
# hand — and the tag is created on the exact commit this job builds,
# so the released bits and the tagged tree can never diverge.  #244:
# the frozen transcription engine (PyInstaller onefile, ~130 MB) is
# built and smoke-tested here too — the bundled config ships it
# inside the installer and beside the portable exe so transcription
# works on a machine with no Python at all.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Tag creation and release upload must not interleave across runs.
  group: release
  cancel-in-progress: false

jobs:
  guard:
    # Cheap pre-flight: skip the heavy Windows build when a GitHub
    # Release already exists for the version tag — e.g. a manual tag
    # push after a successful dispatch run, or a pointless retry.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if gh release view "v$PKG" >/dev/null 2>&1; then
            echo "release v$PKG already exists — skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      # #266: no explicit ref — dispatch builds the selected ref, a
      # tag push builds that tag.  Either way the tag created below
      # lands on the commit this job actually built.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: actions/setup-python@v5
        with:
          # ENGINE_RUNTIME_MATRIX.md: Python 3.12 + ONNX Runtime is
          # the measured-good engine runtime (plain pip install of
          # basic-pitch fails on 3.12 — see the --no-deps step).
          python-version: "3.12"

      - name: Resolve release tag
        shell: bash
        # #266: the tag name comes from the app version, never from
        # manual input — both manifests must agree, and the tag must
        # not already point at a different commit.  Failing here is
        # cheap; failing after a 30-minute build is not.
        run: |
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$PKG" = "$CONF" ] || {
            echo "::error::package.json $PKG != tauri.conf.json $CONF — bump versions first"
            exit 1
          }
          HEAD_SHA=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote origin "refs/tags/v$PKG" | cut -f1)
          PEEL=$(git ls-remote origin "refs/tags/v$PKG^{}" | cut -f1)
          [ -n "$PEEL" ] && REMOTE="$PEEL"
          if [ -n "$REMOTE" ] && [ "$REMOTE" != "$HEAD_SHA" ]; then
            echo "::error::tag v$PKG already exists on $REMOTE — bump the version first"
            exit 1
          fi
          echo "RELEASE_TAG=v$PKG" >> "$GITHUB_ENV"

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck + unit tests
        run: npx tsc --noEmit && npx vitest run

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Python engine tests
        working-directory: ${{ github.workspace }}
        run: |
          pip install pytest -e .
          pytest tests/python -q

      - name: Install engine runtime (known-good ONNX set)
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          # docs/ENGINE_RUNTIME_MATRIX.md: basic-pitch metadata
          # demands a nonexistent TensorFlow on Windows+3.12, so the
          # wheel goes in --no-deps and the ONNX dep set is explicit.
          pip download basic-pitch==0.4.0 --no-deps -d .work/bp_pkg
          pip install --no-deps .work/bp_pkg/basic_pitch-0.4.0-py2.py3-none-any.whl
          pip install onnxruntime librosa mir-eval "numpy<2" pretty-midi \
                      "resampy<0.4.3" scikit-learn scipy typing-extensions \
                      "setuptools<81" soundfile pyinstaller

      - name: Build frozen engine
        working-directory: ${{ github.workspace }}
        run: python scripts/build_engine.py

      - name: Smoke-test frozen engine
        working-directory: ${{ github.workspace }}
        run: |
          # Handshake + one real offline Basic Pitch transcription —
          # a broken bundle fails here, not on a user machine.
          python scripts/smoke_engine.py apps/desktop/src-tauri/resources/engine/hornscribe-engine.exe

      - name: Build NSIS installer (bundled engine)
        run: npm run tauri build -- --config src-tauri/tauri.bundled.json

      - name: Package portable zip
        shell: pwsh
        run: |
          # #244: the portable layout must ship the engine/ resource
          # dir next to the exe — engine.rs probes exe_dir/engine/.
          $exe = "src-tauri/target/release/hornscribe-desktop.exe"
          $engine = "src-tauri/resources/engine"
          $stage = "src-tauri/target/release/portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe $stage
          Copy-Item $engine "$stage/engine" -Recurse
          $zip = "src-tauri/target/release/HornScribe_${{ env.RELEASE_TAG }}_x64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length

      - name: Verify artifacts contain the engine
        shell: pwsh
        run: |
          # The engine binary is ~130 MB — an installer or zip under
          # 50 MB cannot contain it (v0.1.0 shipped 4-5 MB assets).
          $installer = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe
          $zip = Get-Item src-tauri/target/release/*-portable.zip
          if ($installer.Length -lt 50MB) { throw "installer too small to contain the engine: $($installer.Length)" }
          if ($zip.Length -lt 50MB) { throw "portable zip too small to contain the engine: $($zip.Length)" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries
          if (-not ($entries | Where-Object { $_.FullName -eq "engine/hornscribe-engine.exe" })) {
            throw "portable zip does not contain engine/hornscribe-engine.exe"
          }

      - name: Create and push release tag
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          # #266: tag the exact commit this job just built.  A retry
          # after the tag was already pushed reuses it; the resolve
          # step above guarantees it can only ever point at HEAD.
          if ! git ls-remote --exit-code origin "refs/tags/${{ env.RELEASE_TAG }}" >/dev/null 2>&1; then
            git tag "${{ env.RELEASE_TAG }}" "$(git rev-parse HEAD)"
            git push origin "${{ env.RELEASE_TAG }}"
          fi

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          INSTALLER=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          PORTABLE=$(ls src-tauri/target/release/*-portable.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$INSTALLER" "$PORTABLE" --clobber
          else
            gh release create "$TAG" "$INSTALLER" "$PORTABLE" \
              --title "HornScribe $TAG" \
              --notes-file ../../.github/RELEASE_NOTES.md \
              --prerelease
          fi
